name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android_broadcaster

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Gradle version from project
        id: gradle-version
        run: |
          properties=gradle/wrapper/gradle-wrapper.properties
          test -f "$properties" || { echo "Missing $properties"; exit 1; }
          version=$(sed -nE 's@^distributionUrl=.*gradle-([0-9][A-Za-z0-9.+-]*)-(bin|all)\.zip.*@\1@p' "$properties")
          test -n "$version" || { echo "Could not determine Gradle version from $properties"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-broadcaster-debug-apk
          path: android_broadcaster/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
